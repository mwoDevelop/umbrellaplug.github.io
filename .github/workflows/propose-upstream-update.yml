name: propose Umbrella upstream update

on:
  workflow_dispatch:
  schedule:
    - cron: "50 4 * * *"

concurrency:
  group: umbrella-upstream-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      action: ${{ steps.discovery.outputs.action }}
      base_commit: ${{ steps.candidate.outputs.base_commit }}
      candidate_id: ${{ steps.candidate.outputs.candidate_id }}
      downstream_version: ${{ steps.candidate.outputs.downstream_version }}
      expected_tree: ${{ steps.candidate.outputs.expected_tree }}
      observed_commit: ${{ steps.discovery.outputs.observed_commit }}
      materialize_outcome: ${{ steps.materialize.outcome }}
      scan_outcome: ${{ steps.scan.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned test dependencies
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Discover exact upstream state
        run: >-
          python tools/prepare_umbrella_update.py discover
          --output discovery.json
      - name: Export discovery
        id: discovery
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          value = json.loads(Path("discovery.json").read_text())
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write("action=%s\n" % value["action"])
              output.write("observed_commit=%s\n" % value["observed_commit"])
          PY
      - name: Upload discovery before any risky candidate operation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: umbrella-upstream-discovery
          path: discovery.json
          retention-days: 14
      - name: Materialize patch-stack candidate without executing it
        id: materialize
        continue-on-error: true
        if: steps.discovery.outputs.action == 'prepare'
        run: >-
          python tools/prepare_umbrella_update.py prepare
          --discovery discovery.json
          --output candidate
      - name: Export candidate
        if: >-
          steps.discovery.outputs.action == 'prepare' &&
          steps.materialize.outcome == 'success'
        id: candidate
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          value = json.loads(Path("candidate/candidate.json").read_text())
          metadata = value["metadata"]
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write("base_commit=%s\n" % metadata["base_commit"])
              output.write("candidate_id=%s\n" % value["candidate_id"])
              output.write("downstream_version=%s\n" % metadata["downstream_version"])
              output.write("expected_tree=%s\n" % metadata["expected_tree"])
          PY
      - name: Scan exact candidate before executing tests
        id: scan
        continue-on-error: true
        if: >-
          steps.discovery.outputs.action == 'prepare' &&
          steps.materialize.outcome == 'success'
        env:
          CANDIDATE_ID: ${{ steps.candidate.outputs.candidate_id }}
        run: |
          set -euo pipefail
          mkdir -p scan-candidate/tree/omega
          cp candidate/candidate.json scan-candidate/
          cp -a candidate/tree/omega/plugin.video.umbrella scan-candidate/tree/omega/
          cp -a candidate/tree/tools candidate/tree/tests scan-candidate/tree/
          cp candidate/tree/downstream-patches.yml scan-candidate/tree/
          cp candidate/tree/requirements-ci.txt scan-candidate/tree/
          echo "product_candidate_id=$CANDIDATE_ID" > scan-candidate/product-candidate.txt
      - name: Run malware scanners on the exact executable product view
        id: product-scan
        continue-on-error: true
        if: steps.scan.outcome == 'success'
        uses: mwoDevelop/kodi/.github/actions/upstream-malware-scan@0ebfd26322d8686c1bef1222f3783cd8e55c5e78
        with:
          baseline: .github/security-baseline.json
          candidate-path: scan-candidate
          candidate-id: ${{ steps.candidate.outputs.candidate_id }}
          output: security-report.json
      - name: Test the scanned content-addressed candidate
        if: >-
          steps.discovery.outputs.action == 'prepare' &&
          steps.materialize.outcome == 'success' &&
          steps.scan.outcome == 'success' &&
          steps.product-scan.outcome == 'success'
        run: >-
          python tools/prepare_umbrella_update.py test
          --bundle candidate
      - name: Package the verified candidate with executable modes intact
        id: package
        if: >-
          steps.discovery.outputs.action == 'prepare' &&
          steps.materialize.outcome == 'success' &&
          steps.scan.outcome == 'success' &&
          steps.product-scan.outcome == 'success'
        run: tar --format=posix -cf umbrella-candidate.tar -C candidate .
      - name: Upload candidate
        if: >-
          always() &&
          steps.discovery.outputs.action == 'prepare' &&
          steps.package.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: umbrella-upstream-candidate
          path: umbrella-candidate.tar
          retention-days: 7
      - name: Upload scanner attestation
        if: >-
          always() &&
          steps.discovery.outputs.action == 'prepare' &&
          steps.product-scan.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: umbrella-upstream-security
          path: security-report.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Fail closed after recording a patch replay conflict
        if: >-
          always() && steps.discovery.outputs.action == 'prepare' && (
            steps.materialize.outcome == 'failure' ||
            steps.scan.outcome == 'failure' ||
            steps.product-scan.outcome == 'failure'
          )
        run: exit 1

  report:
    needs: prepare
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: umbrella-upstream-discovery
      - name: Reconcile managed issue
        env:
          ACTION: ${{ needs.prepare.outputs.action }}
          MATERIALIZE_OUTCOME: ${{ needs.prepare.outputs.materialize_outcome }}
          SCAN_OUTCOME: ${{ needs.prepare.outputs.scan_outcome }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Managed Umbrella upstream reconciliation"
          issue="$(gh issue list --state open --search "$title in:title" --json number,title --jq '.[] | select(.title == "'"$title"'") | .number' | head -n 1)"
          if [ "$ACTION" = "stop" ] || [ "$ACTION" = "quarantine" ] || [ "$PREPARE_RESULT" = "failure" ]; then
            body="$(mktemp)"
            {
              echo "Umbrella upstream update requires manual review."
              if [ "$MATERIALIZE_OUTCOME" = "failure" ]; then
                echo "Failure code: downstream_patch_conflict"
              elif [ "$SCAN_OUTCOME" = "failure" ]; then
                echo "Failure code: product_scan_view_failed"
              fi
              echo
              echo '```json'
              cat discovery.json
              echo '```'
            } > "$body"
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --body-file "$body"
            else
              gh issue create --title "$title" --body-file "$body"
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Umbrella reconciliation recovered."
          fi

  propose:
    needs: prepare
    if: needs.prepare.outputs.action == 'prepare'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.base_commit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: umbrella-upstream-candidate
          path: candidate-artifact
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: umbrella-upstream-security
          path: security
      - name: Verify scanner attestation against downloaded bytes
        env:
          CANDIDATE_ID: ${{ needs.prepare.outputs.candidate_id }}
          SECURITY_CONTROL_SHA: 0ebfd26322d8686c1bef1222f3783cd8e55c5e78
        run: |
          set -euo pipefail
          python - <<'PY'
          import tarfile
          from pathlib import Path
          Path("candidate").mkdir()
          with tarfile.open("candidate-artifact/umbrella-candidate.tar") as archive:
              archive.extractall("candidate", filter="data")
          PY
          mkdir -p scan-candidate/tree/omega
          cp candidate/candidate.json scan-candidate/
          cp -a candidate/tree/omega/plugin.video.umbrella scan-candidate/tree/omega/
          cp -a candidate/tree/tools candidate/tree/tests scan-candidate/tree/
          cp candidate/tree/downstream-patches.yml scan-candidate/tree/
          cp candidate/tree/requirements-ci.txt scan-candidate/tree/
          echo "product_candidate_id=$CANDIDATE_ID" > scan-candidate/product-candidate.txt
          control="$RUNNER_TEMP/mwodevelop-security-control"
          git init "$control"
          git -C "$control" remote add origin https://github.com/mwoDevelop/kodi.git
          git -C "$control" fetch --depth 1 origin "$SECURITY_CONTROL_SHA"
          test "$(git -C "$control" rev-parse FETCH_HEAD)" = "$SECURITY_CONTROL_SHA"
          git -C "$control" checkout --detach FETCH_HEAD
          python "$control/tools/upstream_security_scan.py" verify \
            --baseline .github/security-baseline.json \
            --candidate scan-candidate \
            --candidate-id "$CANDIDATE_ID" \
            --report security/security-report.json \
            --policy "$control/manifests/upstream-security.json"
      - name: Verify and apply without executing candidate code
        run: >-
          python tools/prepare_umbrella_update.py apply
          --bundle candidate
          --checkout .
      - name: Open or update review-gated PR and ensure CI
        env:
          BASE_COMMIT: ${{ needs.prepare.outputs.base_commit }}
          BRANCH: automation/umbrella-upstream
          CANDIDATE_ID: ${{ needs.prepare.outputs.candidate_id }}
          DOWNSTREAM_VERSION: ${{ needs.prepare.outputs.downstream_version }}
          EXPECTED_TREE: ${{ needs.prepare.outputs.expected_tree }}
          GH_TOKEN: ${{ github.token }}
          OBSERVED_COMMIT: ${{ needs.prepare.outputs.observed_commit }}
        run: |
          git config user.name "mwoDevelop update bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git fetch origin "$BRANCH:refs/remotes/origin/$BRANCH" || true
          test "$(git rev-parse origin/main)" = "$BASE_COMMIT"
          rm -rf -- candidate candidate-artifact scan-candidate security
          git add -A
          actual_tree="$(git write-tree)"
          if [ "$actual_tree" != "$EXPECTED_TREE" ]; then
            echo "Candidate tree mismatch: actual=$actual_tree expected=$EXPECTED_TREE"
            git diff-tree --no-commit-id --raw -r "$EXPECTED_TREE" "$actual_tree"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "Candidate produced no change"
            exit 1
          fi
          git commit -m "Update Umbrella to $DOWNSTREAM_VERSION" \
            -m "Upstream-SHA: $OBSERVED_COMMIT" \
            -m "Candidate-ID: $CANDIDATE_ID"
          remote_sha="$(git show-ref --hash "refs/remotes/origin/$BRANCH" 2>/dev/null || true)"
          if [ -n "$remote_sha" ]; then
            git push origin "HEAD:refs/heads/$BRANCH" \
              "--force-with-lease=refs/heads/$BRANCH:$remote_sha"
          else
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          body="Automated patch-stack replay on exact upstream \`$OBSERVED_COMMIT\`. Candidate-ID: \`$CANDIDATE_ID\`. Protected repository paths are byte-identical to main."
          number="$(gh pr list --state open --head "$BRANCH" --base main --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "Update Umbrella to $DOWNSTREAM_VERSION" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "Update Umbrella to $DOWNSTREAM_VERSION" --body "$body"
          fi
          head_sha="$(git rev-parse HEAD)"
          gh workflow run downstream-tests.yml --ref "$BRANCH"
          found=false
          for attempt in $(seq 1 15); do
            run_head="$(gh run list --workflow downstream-tests.yml \
              --branch "$BRANCH" --event workflow_dispatch --limit 1 \
              --json headSha --jq '.[0].headSha // empty')"
            if [ "$run_head" = "$head_sha" ]; then
              found=true
              break
            fi
            sleep 2
          done
          test "$found" = true
